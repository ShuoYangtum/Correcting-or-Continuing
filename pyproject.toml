[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pssd"
version = "0.1.0"
description = "PSSD: Prompt-Space Self-Distillation - distill a privileged teacher into the input prompt instead of the model weights"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.51.0",
    "peft>=0.11.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
