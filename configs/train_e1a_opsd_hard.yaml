# E1a: the "three alignments" run.
#   A  = privileged teacher p_T(.|x,y*)      -> icps.distill: opsd
#   C1 = contextual-hidden-state encoder      -> icps.encoder_input: context
#   C3 = moderately larger carrier            -> n_tokens 96, bottleneck 768
#   Data = difficulty-filtered hard slice     -> train on base<1 problems only
# Keeps the existing privileged forward-KL objective (B deferred to E1b).
# Single-layer input prefix (no C2). Instruct Qwen3-1.7B, thinking on.
model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: auto
  device: auto
  enable_thinking: true

rewrite:
  k: 1
  style: hint
  few_shot: false
  inference_validate: false

rollout:
  g: 1
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_new_tokens: 8192       # in-job icps sanity eval (rigorous 16k eval run separately)
  append_boxed_instruction: true

reward:
  clip_c: 5.0
  grader: math_verify

outer:
  enabled: false

inner:
  enabled: true
  mode: imitation

train:
  steps: 1
  seed: 42
  scoring_batch_size: 1
  output_dir: ${PSSD_ROOT}/outputs/prefix_e1a_opsd_hard

data:
  train_path: ${PSSD_ROOT}/data/opsd_hard_trainset.jsonl
  eval_path: ${PSSD_ROOT}/data/aime24.jsonl
  max_problems: 30

wandb:
  enabled: true
  project: pssd
  entity: null
  run_name: e1a_opsd_hard_ctx
  mode: online

icps:
  # ---- carrier (C3) + representation (C1) + teacher (A) ----
  n_tokens: 96
  bottleneck: 768
  encoder_input: context
  distill: opsd
  # ---- CE warm-start ----
  ce_epochs: 1
  ce_steps: 500
  ce_batch_size: 1
  ce_grad_accum: 8
  ce_early_stop_patience: 150
  ce_early_stop_min_delta: 0.002
  ce_early_stop_min_steps: 200
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 0.5
  max_prompt_tokens: 1536
  max_target_tokens: 4096
  prefix_l2_coef: 1.0e-4
  # ---- privileged OPSD-KL ----
  opsd_steps: 400
  opsd_batch_size: 1
  opsd_grad_accum: 1
  opsd_max_new_tokens: 4096
  opsd_temperature: 0.6
  opsd_kl_clip: 5.0
  opsd_kl_topk: 64
  opsd_kl_chunk: 64
  opsd_lr_scale: 0.25
  opsd_early_stop_patience: 150
  opsd_early_stop_min_delta: 0.003
  opsd_early_stop_min_steps: 200
  # ---- checkpoints / logging ----
  log_every: 5
  save_every: 200
  opsd_save_every: 100
  # ---- eval (quick in-job sanity; rigorous Avg@k done separately) ----
  use_vllm_base: true
  vllm_gpu_memory_utilization: 0.45
  vllm_max_model_len: 20480
  prefer_zero_if_nonpositive: true
  g_score: 1
  n_solve: 1
  max_eval_problems: 30
  eval_every: 0
